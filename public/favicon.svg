<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#1a0000"/>
  <!-- Crossed swords / lightning -->
  <line x1="25" y1="25" x2="75" y2="75" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
  <line x1="75" y1="25" x2="25" y2="75" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
  <!-- Sword guards -->
  <line x1="18" y1="50" x2="30" y2="50" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="82" y2="50" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>
  <!-- Code brackets -->
  <text x="12" y="42" font-family="monospace" font-size="18" font-weight="bold" fill="#fca5a5" opacity="0.7">&lt;/&gt;</text>
  <!-- Center spark -->
  <circle cx="50" cy="50" r="6" fill="#fef08a"/>
</svg>
